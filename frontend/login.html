<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherFall — Operator Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=11">
</head>
<body class="auth-body">
    <main class="login-page">
        <section class="login-card">
            <header class="login-header">
                <div class="login-header-top">
                    <a href="/" class="brand-group brand-link" title="Go to WeatherFall Main Page">
                        <div class="brand-badge">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
                                <path d="M13 11l-4 6h6l-4 6"/>
                            </svg>
                        </div>
                        <div style="text-align: left;">
                            <h1 class="logo">WeatherFall</h1>
                            <p class="subtitle">Operator Access Console</p>
                        </div>
                    </a>
                    <button type="button" id="theme-toggle-btn" class="theme-toggle-btn" title="Switch between Dark and Light mode" aria-label="Switch theme">
                        <svg id="theme-icon-sun" class="theme-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg id="theme-icon-moon" class="theme-icon hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                        <span id="theme-toggle-label">Light</span>
                    </button>
                </div>
            </header>

            <form id="login-form" class="login-form" autocomplete="on">
                <div class="control-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="admin"
                        required
                        autocomplete="username"
                        spellcheck="false"
                    >
                </div>
                <div class="control-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="run-button" id="login-submit">
                    Authenticate
                </button>

                <div id="login-error" class="login-error hidden" role="alert"></div>
            </form>

            <footer class="login-footer">
                <a href="/" class="auth-link">← Return to Simulator</a>
            </footer>
        </section>
    </main>
    <script src="/static/login.js?v=9"></script>
</body>
</html>
