<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherFall — Operator Sign In</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
    <main class="login-page">
        <section class="login-card">
            <header class="login-header">
                <h1 class="logo">WeatherFall<span>_</span></h1>
                <p class="subtitle">Operator Access Console</p>
            </header>

            <form id="login-form" class="login-form" autocomplete="on">
                <div class="control-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="admin"
                        required
                        autocomplete="username"
                        spellcheck="false"
                    >
                </div>
                <div class="control-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="run-button" id="login-submit">
                    [ AUTHENTICATE ]
                </button>

                <div id="login-error" class="login-error hidden" role="alert"></div>
            </form>

            <footer class="login-footer">
                <a href="/" class="auth-link">← RETURN TO SIMULATOR</a>
            </footer>
        </section>
    </main>
    <script src="/static/login.js"></script>
</body>
</html>
