<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherFall — Admin Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body class="admin-body">
    <header class="admin-header">
        <div class="admin-header-left">
            <div class="brand-group">
                <div class="brand-badge">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
                        <path d="M13 11l-4 6h6l-4 6"/>
                    </svg>
                </div>
                <div>
                    <h1 class="logo">WeatherFall</h1>
                    <span class="admin-subtitle">CRITICAL INFRASTRUCTURE ADMIN</span>
                </div>
            </div>
        </div>
        <div class="admin-header-right">
            <button type="button" id="theme-toggle-btn" class="theme-toggle-btn" title="Switch between Dark and Light mode" aria-label="Switch theme">
                <svg id="theme-icon-sun" class="theme-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg id="theme-icon-moon" class="theme-icon hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <span id="theme-toggle-label">Light</span>
            </button>
            <span class="auth-user" id="admin-user">—</span>
            <a href="/" class="auth-link">Command Map</a>
            <button type="button" class="auth-link" id="admin-logout-btn">Sign Out</button>
        </div>
    </header>

    <main class="admin-layout">
        <section class="admin-panel">
            <h2 class="panel-title">+ REGISTER NEW CRITICAL NODE</h2>

            <form id="node-form" class="node-form">
                <div class="form-row">
                    <div class="control-group">
                        <label for="node-name">Facility Name</label>
                        <input
                            type="text"
                            id="node-name"
                            required
                            maxlength="120"
                            placeholder="e.g. Miami Central Hospital"
                            spellcheck="false"
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="control-group">
                        <label for="node-type">Infrastructure Type</label>
                        <select id="node-type" required>
                            <option value="energy">Energy / Power</option>
                            <option value="water">Water / Sanitation</option>
                            <option value="transport">Transport / Logistics</option>
                            <option value="health">Health / Medical</option>
                            <option value="comms">Communications / Telecom</option>
                        </select>
                    </div>
                </div>

                <div class="form-row two-col">
                    <div class="control-group">
                        <label for="node-x">X (longitude / canvas x)</label>
                        <input type="number" step="any" id="node-x" required placeholder="-80.1918">
                    </div>
                    <div class="control-group">
                        <label for="node-y">Y (latitude / canvas y)</label>
                        <input type="number" step="any" id="node-y" required placeholder="25.7617">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="run-button" id="node-submit">Create Node</button>
                    <button type="button" class="reset-button" id="node-reset">Clear</button>
                </div>

                <div id="node-form-msg" class="form-msg hidden" role="status"></div>

                <p class="hint-text">
                    New nodes are auto-connected to the nearest compatible facility in the dependency graph.
                    Reload the map to see the update.
                </p>
            </form>
        </section>

        <section class="admin-panel admin-panel-wide">
            <h2 class="panel-title">◈ REGISTERED NODES (<span id="nodes-count">0</span>)</h2>

            <div class="nodes-table-wrapper">
                <table class="nodes-table" id="nodes-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NAME</th>
                            <th>TYPE</th>
                            <th>X</th>
                            <th>Y</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="nodes-tbody">
                        <tr><td colspan="6" class="table-empty">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/static/admin.js?v=7"></script>
</body>
</html>
