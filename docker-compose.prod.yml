services:
  traefik:
    image: traefik:v3.1
    container_name: weatherfall_traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=weatherfall_public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entryPoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL must be set in .env.prod}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    networks:
      - weatherfall_public

  db:
    image: postgres:16-alpine
    container_name: weatherfall_db_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - weatherfall_internal

  redis:
    image: redis:7-alpine
    container_name: weatherfall_redis_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.prod}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - weatherfall_internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weatherfall_api_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env.prod
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 10
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env.prod}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set in .env.prod}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env.prod}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${DOMAIN}}
      COOKIE_SECURE: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set in .env.prod}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
    volumes:
      - ./data:/app/data
    command: >
      gunicorn main:app
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --forwarded-allow-ips="*"
      --timeout 120
      --keep-alive 5
      --access-logfile -
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=weatherfall_public"
      - "traefik.http.routers.weatherfall-api.rule=Host(`${DOMAIN:?DOMAIN must be set in .env.prod}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.weatherfall-api.entrypoints=websecure"
      - "traefik.http.routers.weatherfall-api.priority=100"
      - "traefik.http.routers.weatherfall-api.tls=true"
      - "traefik.http.routers.weatherfall-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.weatherfall-api.middlewares=sec-headers@docker"
      - "traefik.http.middlewares.sec-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sec-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.sec-headers.headers.browserXssFilter=true"
      - "traefik.http.services.weatherfall-api.loadbalancer.server.port=8000"
      - "traefik.http.services.weatherfall-api.loadbalancer.passhostheader=true"
    networks:
      - weatherfall_public
      - weatherfall_internal

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weatherfall_celery_worker_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env.prod
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 10
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set in .env.prod}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    volumes:
      - ./data:/app/data
    command: celery -A worker.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - weatherfall_internal

  frontend:
    image: nginx:alpine
    container_name: weatherfall_frontend_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend:/usr/share/nginx/html/static:ro
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=weatherfall_public"
      - "traefik.http.routers.weatherfall-frontend.rule=Host(`${DOMAIN}`) && PathPrefix(`/`)"
      - "traefik.http.routers.weatherfall-frontend.entrypoints=websecure"
      - "traefik.http.routers.weatherfall-frontend.priority=10"
      - "traefik.http.routers.weatherfall-frontend.tls=true"
      - "traefik.http.routers.weatherfall-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.weatherfall-frontend.middlewares=sec-headers@docker"
      - "traefik.http.services.weatherfall-frontend.loadbalancer.server.port=80"
    networks:
      - weatherfall_public

networks:
  weatherfall_public:
    driver: bridge
  weatherfall_internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  letsencrypt_data:

